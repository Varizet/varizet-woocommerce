# Local WordPress + WooCommerce for developing and end-to-end testing the plugin.
#   docker compose -p wptest -f apps/wp-plugin/dev/docker-compose.yml up -d
#   apps/wp-plugin/dev/setup.sh            # installs WordPress, WooCommerce, fa_IR, a product
# Site: http://localhost:8090 (admin / admin). MariaDB on localhost:3307.
# Apache listens on 8090 inside the container too, so WordPress loopback requests
# (WP-Cron, Action Scheduler, Site Health) reach http://localhost:8090.
name: wptest

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db:3306
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DB_NAME: wordpress
  VARIZET_API_BASE_URL: ${VARIZET_API_BASE_URL:-http://host.docker.internal:4000}
  VARIZET_APP_URL: ${VARIZET_APP_URL:-http://localhost:3001}
  # The official images eval this in wp-config.php, so WP-CLI needs it too.
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_ENVIRONMENT_TYPE', 'local' );
    define( 'WP_DEBUG_LOG', true );
    define( 'WP_DEBUG_DISPLAY', false );
    define( 'FS_METHOD', 'direct' );
    define( 'VARIZET_API_BASE_URL', getenv( 'VARIZET_API_BASE_URL' ) ?: 'http://host.docker.internal:4000' );
    define( 'VARIZET_APP_URL', getenv( 'VARIZET_APP_URL' ) ?: 'http://localhost:3001' );

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *wp-env
      WORDPRESS_DEBUG: "1"
    command:
      - bash
      - -c
      - >-
        sed -i 's/^Listen 80$$/Listen 8090/' /etc/apache2/ports.conf &&
        sed -i 's/<VirtualHost \*:80>/<VirtualHost *:8090>/' /etc/apache2/sites-available/000-default.conf &&
        exec docker-entrypoint.sh apache2-foreground
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/varizet-woocommerce

  cli:
    image: wordpress:cli-php8.2
    profiles: ["cli"]
    user: "33:33"
    depends_on:
      - wordpress
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *wp-env
      HOME: /tmp
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/varizet-woocommerce

volumes:
  db:
  wp:
